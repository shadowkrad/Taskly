services:
  taskly:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - DATABASE_URL=file:/app/prisma/dev.db
      - TAAAAC_CORE_URL=https://taaaac.eu
      - TAAAAC_DOMAIN=.taaaac.eu
      - TAAAAC_TOKEN=${TAAAAC_TOKEN:-}
      - TENANT_ID=${TENANT_ID:-demo}
      - NODE_ENV=production
    volumes:
      - taskly_data:/app/prisma
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.taskly-${TENANT_ID:-demo}.rule=Host(`${SUBDOMAIN:-taskly}.taaaac.eu`)"
      - "traefik.http.routers.taskly-${TENANT_ID:-demo}.entrypoints=websecure"
      - "traefik.http.routers.taskly-${TENANT_ID:-demo}.tls.certresolver=letsencrypt"
      - "traefik.http.services.taskly-${TENANT_ID:-demo}.loadbalancer.server.port=3000"

volumes:
  taskly_data:
    name: taskly_${TENANT_ID:-demo}_data

networks:
  traefik-public:
    external: true
